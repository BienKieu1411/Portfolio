<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#dae5f0">
    <meta name="description" content="Huệ ơi, tối thứ Năm đi ăn với anh không?">
    <meta property="og:title" content="Huệ ơi">
    <meta property="og:description" content="Tối thứ Năm đi ăn với anh không?">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://bienkieu1411.github.io/Portfolio/first-date-hue/">
    <title>Huệ ơi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600&family=Patrick+Hand&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=note">
    <script src="script.js?v=note" defer></script>
</head>
<body>
    <main class="note">
        <button class="paper cover" id="open-letter" type="button" aria-controls="invitation" hidden>
            <span class="cover-title">Huệ ơi</span>
            <span class="open-label">Mở ra xem</span>
        </button>

        <article class="paper letter" id="invitation" aria-labelledby="invitation-title">
            <h1 id="invitation-title" tabindex="-1">Huệ ơi,</h1>
            <p class="question">Tối thứ Năm đi ăn với anh không?</p>
            <p class="when"><time datetime="2026-11-19T19:15:00+07:00">7h15 tối, 19/11/2026</time></p>
            <p>Em thích ăn gì thì nhắn anh nhé.</p>
            <p class="signature">Biên</p>

            <div class="reply-options" id="reply-options" hidden>
                <button class="primary" id="reply-yes" type="button">Đi chứ</button>
                <span class="runaway" id="reply-later" aria-hidden="true">Hôm khác</span>
            </div>

            <div class="reply-result" id="reply-result" hidden>
                <p class="reply-message">Ok, vậy tối thứ Năm nhé.</p>
                <button class="primary" id="share-reply" type="button">Chia sẻ câu trả lời</button>
                <button class="back" id="reply-again" type="button">Quay lại</button>
                <p class="share-status" id="share-status" role="status"></p>
            </div>
        </article>
    </main>
</body>
</html>
